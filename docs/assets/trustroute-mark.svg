<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="TrustRoute">
  <title>TrustRoute</title>
  <defs>
    <clipPath id="frame">
      <rect x="6" y="6" width="84" height="84" rx="18"/>
    </clipPath>
  </defs>
  <rect x="6" y="6" width="84" height="84" rx="18" fill="#0d1b2a"/>
  <g clip-path="url(#frame)">
    <!-- the route: three checkpoints, in order -->
    <path d="M22 66 L48 44 L74 30" fill="none" stroke="#3d5a73"
          stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
    <circle cx="22" cy="66" r="7" fill="#0d1b2a" stroke="#7fd1c1"
            stroke-width="3"/>
    <circle cx="48" cy="44" r="7" fill="#0d1b2a" stroke="#7fd1c1"
            stroke-width="3"/>
    <!-- the last checkpoint is the one under question -->
    <circle cx="74" cy="30" r="8.5" fill="#7fd1c1"/>
    <path d="M70.5 30.5 L73.3 33.3 L78 27.6" fill="none" stroke="#0d1b2a"
          stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the record the claim rests on -->
    <rect x="18" y="74" width="30" height="4" rx="2" fill="#3d5a73"/>
    <rect x="18" y="82" width="20" height="4" rx="2" fill="#24384a"/>
  </g>
</svg>
